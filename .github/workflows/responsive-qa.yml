name: Responsive Browser QA
on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/responsive.browser.mjs'
      - '.github/workflows/responsive-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/responsive.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasy-responsive-captures
          path: responsive-artifacts/*.png
          retention-days: 7
