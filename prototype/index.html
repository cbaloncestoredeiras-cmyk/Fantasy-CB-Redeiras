  <script>
// engine.js
/** Regras do Fantasy Redeiras. Módulo puro, independente da interface e do almacenamento. */
const ROSTER_SIZE = 5;
const START_BUDGET = 6;
const TRANSFERS_PER_ROUND = 3;
const MIN_PRICE = 0.45;
const round = (n, places=2)=> Math.round((Number(n)+Number.EPSILON)*10**places)/10**places;
const fmt = (n, digits=1) => new Intl.NumberFormat('gl-ES',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(Number(n)||0);
const moneyFmt = (n) => `${fmt(n,2)} M`;
const valACB = (stats) => {
  if (!stats || stats.played === false) return 0;
  if(stats.directVal!==undefined && stats.directVal!==null && Number.isFinite(Number(stats.directVal)))return Number(stats.directVal);
  const s = stats;
  const num = key => Number(s[key]||0);
  // PTS + REB + ASIS + BR + TAPF + FR - fallos de campo/libres - BP - FP - TAPC.
  return round(num('pts')+num('reb')+num('ast')+num('stl')+num('blk')+num('fr')
    -num('miss2')-num('miss3')-num('missft')-num('tov')-num('pf')-num('blocked'), 1);
};
const scorePlayer = (stats, victory=false, voteBonus=0) => {
  const v=valACB(stats);
  if(!stats || stats.played === false) return 0;
  // O 20 % só se aplica á valoración ACB estritamente positiva.
  // Os votos súmanse despois, evitando multiplicar o bonus social pola vitoria.
  return round(v>0 && victory ? v*1.2+voteBonus : v+voteBonus,1);
};
const summarizeVotes = (ballots, validIds) => {
  const ids=new Set(validIds), votes=Object.entries(ballots||{}).filter(([v,p])=>{
    if (!ids.has(Number(v)) || !p || ![p[3],p[2],p[1]].every(x=>ids.has(Number(x))&&Number(x)!==Number(v)))return false;
    return new Set([p[3],p[2],p[1]].map(Number)).size===3;
  });
  const received=Object.fromEntries([...ids].map(id=>[id,0]));
  for(const [, ballot] of votes) for(const weight of [3,2,1])received[Number(ballot[weight])]+=weight;
  // Un voto de cada xogador 3/2/1, pero impacto final máximo 3 pts.
  // Media de puntos recibidos por votante: resultado auditable e non desproporcionado.
  const bonuses=Object.fromEntries([...ids].map(id=>[id,round(Math.min(3,received[id]/Math.max(1,votes.length)),1)]));
  return {bonuses,received,voterCount:votes.length};
};
const changedCount = (base, current) => Math.max(base.filter(id=>!current.includes(id)).length,current.filter(id=>!base.includes(id)).length);
const cashFor = (startCash, baseIds, rosterIds, prices) => round(startCash + baseIds.filter(id=>!rosterIds.includes(id)).reduce((sum,id)=>sum+(prices[id]||0),0) - rosterIds.filter(id=>!baseIds.includes(id)).reduce((sum,id)=>sum+(prices[id]||0),0),2);
function updatePrice(current, history, played) {
  if (!played) return current; // Non castigar as ausencias.
  const avg=history.reduce((n,val)=>n+val,0)/Math.max(1,history.length);
  // Cotización adaptada ao orzamento 10M/5: 0,50M base + 0,10M por punto medio.
  const target=Math.max(MIN_PRICE,0.5+Math.max(0,avg)*0.10);
  return round(Math.max(MIN_PRICE,Math.max(current*.85,Math.min(current*1.15,target))),2);
}
function parseDelimited(text, sep) {
  text=String(text).replace(/^\uFEFF/,'');
  if(!sep){const first=text.split(/\r?\n/,1)[0];sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';if(first.includes('\t'))sep='\t';}
  const rows=[];let current='', row=[],quoted=false;
  for(let j=0;j<text.length;j++){
    const c=text[j];
    if(c==='"') {if(quoted&&text[j+1]==='"'){current+='"';j++;}else quoted=!quoted;}
    else if(!quoted&&c===sep){row.push(current);current='';}
    else if(!quoted&&(c==='\r'||c==='\n')){if(c==='\r'&&text[j+1]==='\n')j++;row.push(current);if(row.some(x=>x.trim()))rows.push(row);row=[];current='';}
    else current+=c;
  }
  row.push(current);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}

function detectMapping(headers){
  const used=new Set();return Object.fromEntries(Object.entries(aliases).map(([key,values])=>{
    const index=headers.findIndex((h,i)=> !used.has(i)&&values.includes(normalize(h)));
    if(index>=0)used.add(index);return [key,index];
  }));
}
function mapStatsRows(rows, mapping, players){
  const result=[],errors=[];
  for(let i=0;i<rows.length;i++){
    const row=rows[i],get=key=>mapping[key]>=0?row[mapping[key]]:undefined;
    if(!row.some(v=>String(v??'').trim()))continue;
    const idraw=get('id'),name=get('name');
    let p=(idraw!==undefined&&idraw!=='')?players.find(x=>x.id===Number(idraw)):null;
    if(!p&&name)p=players.find(x=>normalize(x.name)===normalize(name));
    if(!p){
      if(['totais','totales','total','equipo','team','subtotal'].includes(normalize(name||idraw)))continue;
      errors.push(`Fila ${i+2}: xogador non atopado (${name||idraw||'sen nome'})`);continue;
    }
    const value=(k)=>{const raw=get(k);if(raw===undefined||raw===null||raw==='')return 0;const n=Number(String(raw).replace(/\s/g,'').replace(',','.'));if(!Number.isFinite(n)||n<0)throw Error(`Fila ${i+2}: valor inválido en ${k}`);return n;};
    try{
      const entry={id:p.id,name:p.name,stats:{played:true}};
      for (const [key] of STAT_FIELDS.slice(2))entry.stats[key]=value(key);
      if(mapping.val>=0 && get('val')!==undefined && String(get('val')).trim()!==''){
        const direct=Number(String(get('val')).trim().replace(',','.'));
        if(!Number.isFinite(direct))throw Error(`Fila ${i+2}: valoración directa non válida`);
        entry.stats.directVal=direct;
      }
      for(const [field,made,attempt] of [['missft','t1m','t1a'],['miss2','t2m','t2a'],['miss3','t3m','t3a']]){
        if(mapping[field]<0&&mapping[made]>=0&&mapping[attempt]>=0){const v=value(attempt)-value(made);if(v<0)throw Error(`Fila ${i+2}: intentos menores que acertos (${field})`);entry.stats[field]=v;}
      }
      result.push(entry);
    }catch(e){errors.push(e.message)}
  }
  if(new Set(result.map(r=>r.id)).size!==result.length)errors.push('Hai xogadores duplicados no ficheiro.');
  return {items:result,errors};
}

/** Umbrales exactos para el motor de precio actual: mínimo 0,45 M, media acumulada y límite ±15 %. */
function brokerThresholds(price,history=[]){
 const h=history.filter(Number.isFinite),targetUp=Math.round(price*1.15*100)/100,targetDown=Math.max(.45,Math.round(price*.85*100)/100);
 const f=v=>updatePrice(price,[...h,v],true);
 // búsqueda en décimas para coincidir con la precisión publicada del fantasy
 const candidates=Array.from({length:2001},(_,i)=>Math.round((i-500)/10)/1); // -50 a 150
 const up=candidates.find(v=>f(v)>=targetUp-0.00001);
 const down=[...candidates].reverse().find(v=>f(v)<=targetDown+0.00001);
 const flat=candidates.reduce((best,v)=>Math.abs(f(v)-price)<Math.abs(f(best)-price)?v:best,0);
 return {up:up??null,down:down??null,flat:flat??null};
}

 const cols=rows[0].map(x=>String(x).trim().toLowerCase());const idx=k=>cols.indexOf(k);
 if(['xornada','data','rival','local'].some(k=>idx(k)<0))return {matches,errors:['Faltan columnas: xornada,data,rival,local']};
 rows.slice(1).forEach((r,i)=>{if(!r.some(x=>String(x).trim()))return;const round=Number(r[idx('xornada')]),date=String(r[idx('data')]||'').trim(),opponent=String(r[idx('rival')]||'').trim(),loc=String(r[idx('local')]||'').trim().toLowerCase(),status=idx('estado')>=0?String(r[idx('estado')]||'scheduled').trim().toLowerCase():'scheduled';
 const key=round+'|'+date;if(!Number.isInteger(round)||round<1||!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date))||!opponent||!['si','sí','no','local','visitante','true','false','1','0'].includes(loc)||!['scheduled','postponed','bye','played'].includes(status)||seen.has(key)){errors.push('Fila '+(i+2)+': datos inválidos ou duplicados');return}seen.add(key);matches.push({round,date,opponent,home:['si','sí','local','true','1'].includes(loc),status})});return {matches,errors};
}

/** Lector mínimo XLSX para a demo, sen dependencias de CDNs nin envío de datos. */
const utf8=new TextDecoder('utf-8');
function findZipEntries(buffer){
  const v=new DataView(buffer),a=new Uint8Array(buffer);let end=-1;
  for(let i=a.length-22;i>=Math.max(0,a.length-65558);i--){if(v.getUint32(i,true)===0x06054b50){end=i;break}}
  if(end<0)throw Error('O ficheiro non é un XLSX/ZIP válido.');
  const count=v.getUint16(end+10,true),entries=new Map();let o=v.getUint32(end+16,true);
  for(let j=0;j<count;j++){
    if(v.getUint32(o,true)!==0x02014b50)throw Error('Directorio ZIP non válido.');
    const method=v.getUint16(o+10,true),size=v.getUint32(o+20,true),n=v.getUint16(o+28,true),e=v.getUint16(o+30,true),c=v.getUint16(o+32,true),pos=v.getUint32(o+42,true);
    const name=utf8.decode(a.slice(o+46,o+46+n)).replace(/^\//,'');
    entries.set(name,{method,size,pos});o+=46+n+e+c;
  }
  async function read(name){
    const entry=entries.get(name);if(!entry)throw Error(`Non se atopou ${name} no XLSX.`);
    const l=entry.pos;if(v.getUint32(l,true)!==0x04034b50)throw Error('Entrada ZIP non válida.');
    const start=l+30+v.getUint16(l+26,true)+v.getUint16(l+28,true),raw=a.slice(start,start+entry.size);
    if(entry.method===0)return utf8.decode(raw);
    if(entry.method!==8)throw Error('O XLSX usa unha compresión non admitida.');
    if(typeof DecompressionStream==='undefined')throw Error('Este navegador non admite XLSX local. Exporta as estatísticas a CSV.');
    try{
      const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return utf8.decode(await new Response(stream).arrayBuffer());
    }catch{throw Error('Non se puido ler este XLSX. Podes exportalo a CSV e importalo igualmente.');}
  }
  return {read,entries};
}
const xml=text=>{const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw Error('O XLSX contén XML non válido.');return doc};
const all=(el,tag)=>[...el.getElementsByTagNameNS('*',tag)];
const first=(el,tag)=>all(el,tag)[0];
async function readXlsx(arrayBuffer){
  const zip=findZipEntries(arrayBuffer);
  const workbook=xml(await zip.read('xl/workbook.xml'));
  const sheet=first(workbook,'sheet');if(!sheet)throw Error('O Excel non ten follas.');
  const id=sheet.getAttribute('r:id');const rels=xml(await zip.read('xl/_rels/workbook.xml.rels'));
  const rel=all(rels,'Relationship').find(x=>x.getAttribute('Id')===id);
  if(!rel)throw Error('Non se atopou a folla principal.');
  const target=rel.getAttribute('Target');
  const path=target.startsWith('/')?target.slice(1):target.startsWith('xl/')?target:'xl/'+target;
  const worksheet=xml(await zip.read(path));
  let shared=[];
  if(zip.entries.has('xl/sharedStrings.xml')){
    const ss=xml(await zip.read('xl/sharedStrings.xml'));
    shared=all(ss,'si').map(si=>all(si,'t').map(t=>t.textContent).join(''));
  }
  const rows=[];
  for(const r of all(worksheet,'row')){
    const out=[];
    for(const c of all(r,'c')){
      const addr=c.getAttribute('r')||'';const letters=addr.match(/^[A-Z]+/i)?.[0]||'A';
      let idx=0;for(const ch of letters.toUpperCase())idx=idx*26+(ch.charCodeAt(0)-64);idx--;
      const kind=c.getAttribute('t'),v=first(c,'v');
      let val=v?.textContent||'';
      if(kind==='s')val=shared[Number(val)]||'';
      else if(kind==='inlineStr')val=all(c,'t').map(t=>t.textContent).join('');
      else if(kind==='b')val=val==='1'?'Sí':'No';
      out[idx]=val;
    }
    if(out.some(x=>String(x??'').trim()))rows.push(Array.from({length:out.length},(_,i)=>out[i]??''));
  }
  return {rows,sheetName:sheet.getAttribute('name')||'Folla 1'};
}

function canTrade(p){
 if(s.phase==='locked')return false;
 if(s.roster.includes(p.id))return usedChanges(s.roster.filter(id=>id!==p.id))<=3;
 if(s.roster.length<ROSTER_SIZE)return cash()+.00001>=p.price&&usedChanges([...s.roster,p.id])<=3&&validFive([...s.roster,p.id]);
 return s.roster.some(oldId=>cash()+player(oldId).price+.00001>=p.price && usedChanges([...s.roster.filter(id=>id!==oldId),p.id])<=3 && validFive([...s.roster.filter(id=>id!==oldId),p.id]));
}

async function loadStatsFile(file){if(!file)return;
 if(file.size>5*1024*1024){toast('O ficheiro supera os 5 MB. Exporta só a folla das estatísticas.','error');return}
 try{
  let grid;
  if(file.name.toLowerCase().endsWith('.xlsx')){grid=(await readXlsx(await file.arrayBuffer())).rows;}
  else if(/\.(csv|tsv)$/i.test(file.name)){grid=parseDelimited(await file.text());}
  else throw Error('Formato non admitido. Utiliza XLSX ou CSV.');
  if(!grid||grid.length<2)throw Error('O ficheiro non ten suficientes filas.');
  const rawGrid=grid.map(r=>r.map(String));
  let bestIndex=0,bestScore=-1;
  for(let j=0;j<Math.min(12,rawGrid.length-1);j++){
    const map=detectMapping(rawGrid[j]);const score=['id','name','pts','reb','ast','val','t2a','t2m'].filter(k=>map[k]>=0).length;
    if(score>bestScore){bestScore=score;bestIndex=j}
  }
  const headers=rawGrid[bestIndex],rows=rawGrid.slice(bestIndex+1);
  const mapping=detectMapping(headers);
  ephemeral.preview={file:file.name,rawGrid,headerIndex:bestIndex,headers,rows,mapping};
  render();toast('Ficheiro lido. Revisa a correspondencia das columnas.');
 }catch(err){toast(err.message||'Non se puido ler o ficheiro.','error')}
}

async function compressPhoto(file){
 if(file.size>4*1024*1024)throw Error('Fotografía demasiado grande: máximo 4 MB.');
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Non se puido abrir a fotografía.'));i.src=url});
  const c=document.createElement('canvas'),max=480,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.round(img.naturalWidth*ratio);c.height=Math.round(img.naturalHeight*ratio);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.78);
 }finally{URL.revokeObjectURL(url)}
}
function finalizeRound(){if(!s.statsReady){toast('Importa as estatísticas antes de publicar.','error');return}

 const result=Number((s.roster.reduce((sum,id)=>sum+(scored.find(x=>x.p.id===id)?.score||0),0)*(s.roster.length<5?.5:1)).toFixed(1));

 s.history.push({round:pastRound,points:result,roster:[...s.roster],savedAt:new Date().toISOString(),win:s.victory});

   if(s.demoRole==='fan'){toast('Rol sen permiso de voto.','error');break}
   if(!s.calledIds.includes(Number(s.voterId))){toast('O votante non figura na convocatoria.','error');break}
   if(s.statsReady){toast('A votación pechou ao importarse as estatísticas.','error');break}
   const voter=Number(s.voterId),v={};for(const weight of [3,2,1])v[weight]=Number(document.getElementById('vote-'+weight)?.value);
   const ids=Object.values(v);if(ids.some(x=>!x||x===voter)||new Set(ids).size!==3){toast('Escolle tres compañeiros distintos e non te votes.','error');break}
   if(ids.some(x=>!s.calledIds.includes(x))){toast('Só podes votar a compañeiros convocados.','error');break}s.ballots[voter]=v;save();render();toast('Votación gardada para esta xornada.');break;
  }
  case 'download-csv':downloadCSV();break;
  case 'demo-stats':demoStats();break;
  case 'confirm-import':confirmImport();break;
  case 'close-round':ephemeral.modal={type:'confirm-round'};render();break;
  case 'confirm-round':finalizeRound();break;
  case 'edit-player':ephemeral.modal={type:'player',id:Number(id)};render();break;
  case 'save-player':savePlayer(Number(id));break;
  case 'download-state':download('redeiras_fantasy_demo_backup.json',JSON.stringify(s,null,2),'application/json');toast('Exportouse un arquivo JSON da demo.');break;
  case 'reset':ephemeral.modal={type:'reset'};render();break;
  case 'confirm-reset':s=initialState();ephemeral.drawer=null;ephemeral.modal=null;ephemeral.preview=null;save();render();toast('Demostración restablecida.');break;
 }
}
async function savePlayer(id){const p=player(id),name=document.getElementById('edit-name')?.value.trim(),number=document.getElementById('edit-number')?.value.trim()===''?null:Number(document.getElementById('edit-number')?.value),price=Number(document.getElementById('edit-price')?.value),pos=document.getElementById('edit-pos')?.value,file=document.getElementById('edit-photo')?.files?.[0];
 if(!p||!name||name.length>40||!Number.isInteger(number)||number<0||number>99||price<.45||price>10||!Number.isFinite(price)){toast('Revisa nome, dorsal e prezo.','error');return}
 if(s.players.some(x=>x.id!==id&&normalize(x.name)===normalize(name))){toast('Xa existe outro xogador con ese nome.','error');return}
 let photo=p.photo;if(file){try{photo=await compressPhoto(file)}catch(err){toast(err.message,'error');return}}
 p.name=name;p.number=number;p.price=Math.round(price*100)/100;p.pos=pos;if(photo)p.photo=photo;ephemeral.modal=null;save();render();toast(`${p.name}: ficha actualizada.`);
}
function handleChange(e){const target=e.target;if(target.id==='demo-role'){s.demoRole=target.value;if((s.tab==='admin'&&s.demoRole!=='admin')||(s.tab==='votos'&&s.demoRole==='fan'))s.tab='inicio';save();render();return}if(target.id==='calendar-file'){loadCalendarFile(target.files?.[0]);return}if(target.id==='stats-file'){loadStatsFile(target.files?.[0]);return}if(!target.dataset.change)return;
 switch(target.dataset.change){
  case 'sort':s.sort=target.value;break;
  case 'rankCategory':s.rankingCategory=target.value;break;
  case 'voter':s.voterId=Number(target.value);break;
  case 'victory':s.victory=target.checked;break;
  case 'phase':if(s.statsReady&&!target.checked){toast('Non se pode reabrir o mercado con puntuacións xa importadas.','error');render();return}s.phase=target.checked?'locked':'open';break;
  case 'mapping':if(ephemeral.preview)ephemeral.preview.mapping[target.dataset.field]=Number(target.value);render();return;
  case 'headerRow':if(ephemeral.preview){const p=ephemeral.preview;p.headerIndex=Number(target.value);p.headers=p.rawGrid[p.headerIndex];p.rows=p.rawGrid.slice(p.headerIndex+1);p.mapping=detectMapping(p.headers);}render();return;
 }
 save();render();
}
function handleInput(e){if(e.target.id==='market-search'){const t=e.target,position=t.selectionStart;s.query=t.value;save();document.getElementById('market-results').innerHTML=marketRows();}}
root.addEventListener('click',handleClick);
root.addEventListener('change',handleChange);
root.addEventListener('input',handleInput);
root.addEventListener('dragover',e=>{if(e.target.closest('#drop-zone')){e.preventDefault();e.target.closest('#drop-zone').classList.add('drag')}});
root.addEventListener('dragleave',e=>{if(e.target.closest('#drop-zone'))e.target.closest('#drop-zone').classList.remove('drag')});
root.addEventListener('drop',e=>{if(e.target.closest('#drop-zone')){e.preventDefault();e.target.closest('#drop-zone').classList.remove('drag');loadStatsFile(e.dataTransfer?.files?.[0]);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(ephemeral.modal||ephemeral.drawer)){ephemeral.modal=null;ephemeral.drawer=null;render()}});
render();

</script>
